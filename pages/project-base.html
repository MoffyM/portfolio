<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{TITLE} - 周芷琦 · 个人作品集</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        /* 二级页小调整 */
        .ppt-frame { background: #f4f1eb; border: 2px solid #1a1a1a; }
        .ppt-shadow { box-shadow: 8px 8px 0 rgba(26,26,26,1); }
    </style>
</head>
<body class="bg-base text-ink font-mono antialiased overflow-x-hidden">

    <!-- 顶部标识 -->
    <main class="max-w-[1440px] mx-auto border-x border-grid relative flex flex-col min-h-screen">

        <header class="flex justify-between items-center py-3 px-6 border-b border-grid text-xs uppercase tracking-widest font-semibold text-ink/70">
            <a href="../index.html#timeline" class="flex items-center gap-4 hover:text-accent transition-colors">
                <div class="w-3 h-3 bg-secondary"></div>
                <span>周芷琦 · 个人作品集</span>
            </a>
            <div class="hidden md:flex items-center gap-2 text-secondary">
                <iconify-icon icon="solar:target-linear" class="text-base"></iconify-icon>
            </div>
            <div class="hidden md:flex items-center gap-4">
                <span>项目 / {NUM}</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="relative border-b border-grid flex flex-col p-8 md:p-16 overflow-hidden">
            <div class="text-accent font-semibold tracking-widest mb-6 border-b-2 border-secondary inline-block pb-1 self-start">
                {SUBTITLE}
            </div>
            <h1 class="font-sans font-bold text-5xl md:text-7xl leading-[0.9] tracking-tight uppercase mb-8 {TITLE_COLOR}">
                {TITLE}
            </h1>
            <p class="text-sm md:text-base max-w-2xl leading-relaxed font-semibold mb-12">
                {DESCRIPTION}
            </p>

            <!-- 关键数据 -->
            <div class="flex flex-wrap gap-4 text-xs font-semibold tracking-widest">
                {TAGS}
            </div>
        </section>

        <!-- PPT 展示区 -->
        <section class="relative border-b border-grid flex flex-col p-8 md:p-16 bg-grid/10">
            <header class="flex justify-between items-center mb-12 text-xs font-semibold uppercase tracking-widest border-b border-grid pb-4">
                <span class="text-accent">// PROJECT DECK</span>
                <span class="text-secondary">{NUM} / 05</span>
            </header>

            <!-- PPT 容器 - 等你给内容 -->
            <div class="ppt-frame ppt-shadow aspect-video w-full flex flex-col items-center justify-center p-12 text-center">
                <iconify-icon icon="solar:gallery-wide-linear" class="text-6xl text-ink/30 mb-4"></iconify-icon>
                <p class="text-sm font-semibold tracking-widest uppercase text-ink/50">
                    PPT 展示区
                </p>
                <p class="text-xs text-ink/40 mt-2 max-w-md">
                    把项目 PPT 的内容（截图、PDF 转图片、或者直接放文字段落）放在这里即可。
                </p>
            </div>

            <!-- 占位 PPT 卡片 - 之后替换 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
                <div class="ppt-frame ppt-shadow aspect-video flex flex-col items-center justify-center p-6">
                    <span class="text-[10px] text-ink/40 tracking-widest">SLIDE 02</span>
                    <p class="text-xs text-ink/60 mt-2">背景与目标</p>
                </div>
                <div class="ppt-frame ppt-shadow aspect-video flex flex-col items-center justify-center p-6">
                    <span class="text-[10px] text-ink/40 tracking-widest">SLIDE 03</span>
                    <p class="text-xs text-ink/60 mt-2">过程与方法</p>
                </div>
                <div class="ppt-frame ppt-shadow aspect-video flex flex-col items-center justify-center p-6">
                    <span class="text-[10px] text-ink/40 tracking-widest">SLIDE 04</span>
                    <p class="text-xs text-ink/60 mt-2">结果与数据</p>
                </div>
                <div class="ppt-frame ppt-shadow aspect-video flex flex-col items-center justify-center p-6">
                    <span class="text-[10px] text-ink/40 tracking-widest">SLIDE 05</span>
                    <p class="text-xs text-ink/60 mt-2">复盘与思考</p>
                </div>
            </div>
        </section>

        <!-- 底部 -->
        <footer class="border-t border-grid py-4 px-6 flex justify-between items-center text-[10px] font-semibold uppercase tracking-widest text-ink bg-base z-30">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-secondary"></div>
                <span>PEOPLE. STORIES. IDEAS. GROWTH.</span>
            </div>
            <a href="../index.html#timeline" class="text-accent hover:text-ink transition-colors">
                ← 返回主页
            </a>
            <div class="flex items-center gap-4">
                <span>© 2026 周芷琦</span>
                <div class="w-2 h-2 bg-secondary"></div>
            </div>
        </footer>

    </main>

    <script src="../assets/js/vendor.js"></script>
    <script src="../assets/js/iconify.js"></script>
    <script src="../assets/js/tailwind-config.js"></script>
</body>
</html>
